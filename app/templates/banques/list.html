{% extends "base.html" %}
{% block content %}
<h1>Banques</h1>
<form method="post" action="/banques">
  <fieldset role="group">
    <input type="text" name="nom" placeholder="Nom de la banque" required>
    <button type="submit">Ajouter</button>
  </fieldset>
</form>
<div class="grid">
  {% for banque in banques %}
    <article><a href="/banques/{{ banque.id }}" role="button" class="outline">{{ banque.nom }}</a></article>
  {% endfor %}
</div>
{% endblock %}
