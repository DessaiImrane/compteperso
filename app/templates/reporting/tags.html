{% extends "base.html" %}
{% block content %}
<h1>Dépenses par tag</h1>
<form method="get" action="/reporting/tags">
  <fieldset role="group">
    <input type="date" name="date_debut" value="{{ date_debut }}" aria-label="Date début">
    <input type="date" name="date_fin" value="{{ date_fin }}" aria-label="Date fin">
    <button type="submit">Afficher</button>
  </fieldset>
</form>
<ul>
  {% for tag, montant in depenses.items() %}<li>{{ tag }} : {{ montant|money }}</li>{% endfor %}
</ul>
<canvas id="chart-tags" width="400" height="200"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
new Chart(document.getElementById('chart-tags'), {
  type: 'bar',
  data: {
    labels: {{ depenses.keys() | list | tojson }},
    datasets: [{ label: 'Dépenses par tag', data: {{ depenses.values() | list | tojson }} }]
  }
});
</script>
{% endblock %}
