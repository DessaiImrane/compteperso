<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comptes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <style>
    :root {
      --pico-border-radius: 10px;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --pico-primary: var(--accent);
      --pico-primary-background: var(--accent);
      --pico-primary-hover-background: var(--accent-hover);
      --pico-primary-border: var(--accent);
      --pico-primary-hover-border: var(--accent-hover);
      --sidebar-bg: #f8fafc;
      --sidebar-border: #e2e8f0;
      --row-hover: #eef2ff;
    }
    html, body { height: 100%; margin: 0; }
    body { background: #f1f5f9; }

    .app-shell { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      width: 260px; flex-shrink: 0; background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border); overflow-y: auto;
      height: 100vh; padding: 1.25rem 0.9rem; box-sizing: border-box;
    }
    .sidebar-title {
      font-weight: 700; font-size: 1.05rem; margin: 0 0.25rem 1.25rem; color: #0f172a;
      display: block; text-decoration: none;
    }
    .sidebar-title:hover { color: var(--accent); }
    .bank-group { margin-bottom: 1.1rem; }
    .bank-name {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      color: #64748b; padding: 0.2rem 0.25rem; margin-bottom: 0.15rem; display: block; text-decoration: none;
    }
    .bank-name:hover { color: var(--accent); }
    .compte-list { list-style: none; margin: 0; padding: 0; }
    .compte-row {
      display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: grab;
    }
    .compte-row:hover { background: var(--row-hover); }
    .compte-row a { text-decoration: none; color: #1e293b; flex: 1; font-size: 0.92rem; }
    .drag-handle { color: #cbd5e1; font-size: 0.85rem; }
    .sidebar-nav { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--sidebar-border); }
    .sidebar-nav ul { list-style: none; margin: 0; padding: 0; }
    .sidebar-nav a {
      display: block; padding: 0.4rem 0.5rem; border-radius: 8px; color: #334155;
      text-decoration: none; font-size: 0.9rem;
    }
    .sidebar-nav a:hover { background: var(--row-hover); color: var(--accent); }

    main.main-scroll { flex: 1; overflow-y: auto; height: 100vh; padding: 2rem 2.5rem; box-sizing: border-box; }
    main.main-scroll > :first-child { margin-top: 0; }

    table { border-collapse: collapse; overflow-x: auto; display: block; white-space: nowrap; }
    table.fixed {
      display: table; table-layout: fixed; width: 100%; white-space: normal;
    }
    table.fixed td, table.fixed th { overflow: hidden; text-overflow: ellipsis; }
    th, td { text-align: left; padding: 0.55rem 0.85rem; }
    tr.row-clickable { cursor: pointer; }
    tr.row-clickable:hover { background: var(--row-hover); }
    thead th { color: #64748b; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--sidebar-border); }
    tbody tr { border-bottom: 1px solid #f1f5f9; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .amt-pos { color: #16a34a; }
    .amt-neg { color: #dc2626; }

    article { border-radius: var(--pico-border-radius); box-shadow: 0 1px 3px rgba(15, 23, 42, .08); margin-bottom: 1.25rem; }
    button, input[type="submit"], [role="button"] { border-radius: 8px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="sidebar-title" href="/banques">Comptes</a>
      {% for entry in sidebar_banques %}
        <div class="bank-group">
          <a class="bank-name" href="/banques/{{ entry.banque.id }}">{{ entry.banque.nom }}</a>
          <ul class="compte-list" data-banque-id="{{ entry.banque.id }}">
            {% for compte in entry.comptes %}
              <li class="compte-row" data-id="{{ compte.id }}">
                <span class="drag-handle">⠿</span>
                <a href="/comptes/{{ compte.id }}/transactions">{{ compte.nom }}</a>
              </li>
            {% endfor %}
          </ul>
        </div>
      {% endfor %}
      <nav class="sidebar-nav">
        <ul>
          <li><a href="/rapprochement">Rapprochement</a></li>
          <li><a href="/creanciers">Créanciers</a></li>
          <li><a href="/reporting/mensuel">Rapport mensuel</a></li>
          <li><a href="/reporting/tags">Dépenses par tag</a></li>
          <li><a href="/reglages">Réglages</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main-scroll">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    document.querySelectorAll('.compte-list').forEach(function (list) {
      new Sortable(list, {
        animation: 150,
        handle: '.drag-handle',
        onEnd: function () {
          const ids = Array.from(list.children).map(function (li) { return parseInt(li.dataset.id, 10); });
          fetch('/banques/' + list.dataset.banqueId + '/comptes/ordre', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ordre: ids }),
          });
        },
      });
    });
  </script>
</body>
</html>
